name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run timing tests with sanitizers
        env:
          CXX: clang++
        run: bash tools/test.sh

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned ESPHome
        run: pip install -r requirements.txt
      - name: Generate compile-only dummy credentials
        run: python tools/write_ci_secrets.py
      - name: Validate configuration
        run: esphome config water-heater.yaml
      - name: Compile firmware
        run: esphome compile water-heater.yaml
