name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run timing tests with sanitizers
        env:
          CXX: clang++
        run: bash tools/test.sh
      - name: Test cycle analysis
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned ESPHome
        run: pip install -r requirements.txt
      - name: Generate compile-only dummy credentials
        run: python tools/write_ci_secrets.py
      - name: Validate configuration
        run: esphome config water-heater.yaml
      - name: Compile firmware
        run: esphome compile water-heater.yaml
